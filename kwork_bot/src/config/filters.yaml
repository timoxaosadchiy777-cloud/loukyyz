# Конфигурируемые фильтры отбора заказов Kwork.
# Файл читается на старте и валидируется схемой schemas.filters.FilterConfig.

# Ключевые слова: заказ проходит, если найдено хотя бы одно (в заголовке/описании).
# Пусто -> фильтр по ключевым словам отключён.
keywords:
  - python
  - парсер
  - парсинг
  - бот
  - автоматизац
  - скрипт
  - api
  - телеграм

# Стоп-слова: заказ отсекается, если найдено хотя бы одно.
stop_words:
  - за отзыв
  - за отзывы
  - бесплатно
  - за лайк
  - за репост
  - тестовое бесплатно

# Минимальный бюджет в рублях (заказы с распознанной суммой ниже отсекаются).
min_budget: 1000
