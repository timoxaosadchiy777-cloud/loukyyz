# ============================================================
#  LeadHunter — оперативные настройки (правьте на ходу).
#  Скопируйте в settings.yaml — или он создастся сам при первом запуске.
#  Файл перечитывается автоматически, перезапуск не нужен.
# ============================================================

# Минимальный AI Score (0..100): заказы с оценкой ниже не доходят до Telegram.
min_score: 60

# Предварительный фильтр по бюджету (USD): заказы с распознанной суммой ниже
# отсекаются ещё ДО обращения к ИИ (экономия запросов). Лиды без явной суммы
# проходят дальше и оцениваются ИИ.
min_budget: 50

# Биржи выбирает КАЖДЫЙ пользователь сам — в боте: ⚙️ Настройки → 🌐 Биржи.
# Этот список нужен только как аварийный рубильник владельца: перечисленные
# здесь площадки разрешены, остальные не опрашиваются ни у кого.
# Пустой список [] (по умолчанию) = ничего не запрещаем.
# Возможные значения: upwork, kwork, kwork_com, freelancer, peopleperhour, guru, weworkremotely
enabled_sources: []

# LLM-провайдер. По умолчанию — локальный Ollama: бесплатно, без API-ключей.
# Установка: https://ollama.com/download , затем `ollama pull llama3.1:8b`.
# Полегче/побыстрее на слабом ПК: llama3.2:3b или qwen2.5:7b.
llm:
  provider: ollama
  model: llama3.1:8b
  base_url: http://localhost:11434
