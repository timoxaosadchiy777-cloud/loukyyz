services:
  leadhunter:
    build: .
    image: leadhunter:latest
    container_name: leadhunter
    restart: unless-stopped
    env_file: .env
    environment:
      # Базу держим на томе — переживает пересборку контейнера.
      DATABASE_PATH: /app/data/leadhunter.db
    volumes:
      - ./data:/app/data
