services:
  leadhunter:
    build: .
    image: leadhunter:latest
    container_name: leadhunter
    restart: unless-stopped
    env_file: .env
    environment:
      # Базу и сессию браузера держим на томе — переживают пересборку контейнера.
      DATABASE_PATH: /app/data/leadhunter.db
      KWORK_STORAGE_STATE: /app/data/storage_state.json
    volumes:
      - ./data:/app/data
    # Вход в Kwork делается на хосте (python kwork_login.py) — положите
    # получившийся storage_state.json в ./data перед запуском.
